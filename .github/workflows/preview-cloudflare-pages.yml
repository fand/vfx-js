name: Deploy PR Preview to Cloudflare Pages

on:
    pull_request:
        types: [opened, synchronize, reopened]

concurrency:
    group: cf-preview-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: write

jobs:
    deploy-preview:
        # Fork PRs don't get secrets, so skip the deploy.
        if: github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: pnpm/action-setup@v4

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm run build

            # Served under the same paths as on amagi.dev.
            - name: Build transition demo
              run: pnpm --filter docs-transitions run build:demo

            - name: Collect preview files
              run: |
                  mkdir -p preview
                  cp -r packages/docs/dist preview/vfx-js
                  cp -r packages/docs-transitions/out preview/vfx-js-transitions
                  echo "/ /vfx-js/ 302" > preview/_redirects

            - name: Deploy to Cloudflare Pages
              id: deploy
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: pages deploy preview --project-name=vfx-js --branch=${{ github.head_ref }}

            - name: Comment preview URL on PR
              uses: marocchino/sticky-pull-request-comment@v3
              with:
                  header: cf-preview
                  message: |
                      🚀 **Cloudflare Pages preview** — ${{ github.event.pull_request.head.sha }}

                      | Page | URL |
                      | --- | --- |
                      | Top | ${{ steps.deploy.outputs.pages-deployment-alias-url }}/vfx-js/ |
                      | Examples | ${{ steps.deploy.outputs.pages-deployment-alias-url }}/vfx-js/examples/ |
                      | Storybook | ${{ steps.deploy.outputs.pages-deployment-alias-url }}/vfx-js/storybook/ |
                      | Docs | ${{ steps.deploy.outputs.pages-deployment-alias-url }}/vfx-js/docs/ |
                      | Transition | ${{ steps.deploy.outputs.pages-deployment-alias-url }}/vfx-js-transitions/ |

                      <sub>This branch URL stays the same across pushes. Latest deploy: ${{ steps.deploy.outputs.deployment-url }}</sub>
